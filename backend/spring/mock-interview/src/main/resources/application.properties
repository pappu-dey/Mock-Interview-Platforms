spring.application.name=mock-interview
server.port=8080

# Load Local Configuration
spring.config.import=optional:classpath:application-secrate.properties,optional:classpath:application-secret.properties,optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Third-Party Services
cloudinary.url=${CLOUDINARY_URL}
gemini.api.key=${GEMINI_API_KEY}