spring.application.name=mock-interview

# Default to active profile 'local' for local development.
# The real credentials should be placed in application-local.properties (which is gitignored).
spring.profiles.active=local

# ─── Database Fallbacks (will be overridden by active profile) ───
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-1f4ebe6b-interviewplatfrom.f.aivencloud.com:12632/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Server ──────────────────────────────────────────────────
server.port=8080

# ─── JWT ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:default_jwt_secret_for_local_development_only_change_in_production}
jwt.expiration=86400000